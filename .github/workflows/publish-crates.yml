name: Publish to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')

          # crates.io answers 403 to requests without a User-Agent (its API
          # data-access policy), so one is mandatory. Without it every check
          # below reads as "not published" and the guard silently does nothing.
          # Insist on 200: a 403 or a network blip is "unknown", not "absent".
          published() {
            [ "$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H 'User-Agent: patent-release (github.com/r14dd/patent)' \
                   "https://crates.io/api/v1/crates/patent/$version")" = "200" ]
          }

          # Idempotent on a robust signal (the crates.io API), not a substring of
          # cargo's stderr: skip cleanly if this exact version is already live.
          if published; then
            echo "patent $version is already on crates.io — skipping."
            exit 0
          fi
          # No --no-verify: keep the pre-publish build/package check before the
          # immutable crates.io upload.
          output=$(cargo publish 2>&1) && exit 0
          # The check above can lose a race: a maintainer publishing locally from
          # the same tag lands the upload during this job's verify+upload window.
          # Re-check the API first; fall back to cargo's wording only if the API
          # is unreachable — and match what the registry actually says, which is
          # "already uploaded", not "already exists".
          if published || echo "$output" | grep -qE "already (uploaded|exists)"; then
            echo "patent $version is on crates.io — published elsewhere while this job ran."
            exit 0
          fi
          echo "$output"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
