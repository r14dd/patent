name: Publish to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # Idempotent on a robust signal (the crates.io API), not a substring of
          # cargo's stderr: skip cleanly if this exact version is already live.
          if curl -fsS "https://crates.io/api/v1/crates/patent/$version" >/dev/null 2>&1; then
            echo "patent $version is already on crates.io — skipping."
            exit 0
          fi
          # No --no-verify: keep the pre-publish build/package check before the
          # immutable crates.io upload.
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
