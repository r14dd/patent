name: Security audit

# Dependabot only opens PRs when a newer crate version exists; it does not
# surface RUSTSEC advisories that lack a fixed release. This job audits the
# locked dependency tree on a schedule and whenever the manifests change.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
