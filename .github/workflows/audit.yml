name: Security audit

# Dependabot only opens PRs when a newer crate version exists; it does not
# surface RUSTSEC advisories that lack a fixed release. This job audits the
# locked dependency tree on a schedule and whenever the manifests change.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.86.3
        with:
          tool: cargo-audit
      # RUSTSEC-2024-0436: `paste` is unmaintained but is only reachable as a
      # transitive proc-macro dependency (via fastembed/image) with no
      # maintained drop-in replacement, so it is accepted explicitly. Real
      # vulnerabilities (anything not ignored here) still fail the job.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0436
