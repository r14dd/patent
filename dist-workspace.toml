[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Read release notes from CHANGELOG.md
changelog = "CHANGELOG.md"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# GitHub repo that hosts the Homebrew tap (create with `gh repo create homebrew-patent`)
tap = "r14dd/homebrew-patent"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# Intel macOS is omitted: ort-sys has no Intel-macOS prebuilt; those users
# install via `cargo install patent` with a local onnxruntime.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Build the Linux targets on a newer image: the onnxruntime prebuilt needs
# glibc >= 2.38, which the default image is too old for.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
